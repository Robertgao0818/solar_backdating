document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(!current){const first=document.querySelector('.anchor');if(first)setCurrent(first);}if(!current)return;if(ev.key==='1')submitVerdict(current,'CONFIRM');else if(ev.key==='2')submitVerdict(current,'SHIFT');else if(ev.key==='3')submitVerdict(current,'UNDATABLE');else if(ev.key==='j'||ev.key==='k'){const all=[...document.querySelectorAll('.anchor')];let i=all.indexOf(current);i+= (ev.key==='j'?1:-1);i=Math.max(0,Math.min(all.length-1,i));all[i].scrollIntoView({block:'center'});setCurrent(all[i]);}});
function buildManifest(){const verdicts=[];for(const id in CONTEXT){const r=state[id];if(!r||!VERDICTS.includes(r.verdict))continue;verdicts.push(Object.assign({}, CONTEXT[id], {verdict:r.verdict,corrected_interval_start:r.verdict==='SHIFT'?(r.corrected_interval_start||''):'',corrected_interval_end:r.verdict==='SHIFT'?(r.corrected_interval_end||''):'',shift_reason:r.verdict==='SHIFT'?(r.shift_reason||'date_correction'):'',dwelling_context:r.verdict==='SHIFT'?(r.dwelling_context||''):'',notes:r.notes||'',opened_ts_utc:r.opened_ts_utc||'',submitted_ts_utc:r.submitted_ts_utc||'',adjudication_seconds:r.adjudication_seconds||0}));}return {schema_version:1,sample_batch_id:BATCH,annotator_id:ANNOTATOR,exported_ts_utc:nowIso(),verdicts:verdicts};}
document.getElementById('export-btn').addEventListener('click',()=>{const manifest=buildManifest();const missing=manifest.verdicts.filter(v=>v.verdict==='SHIFT'&&(!v.corrected_interval_start||!v.corrected_interval_end)).map(v=>v.anchor_id);if(missing.length){const msg=missing.length+' SHIFT verdict(s) missing corrected bracket: '+missing.join(', ')+'. Export anyway?';if(!confirm(msg))return;}const missingDwelling=manifest.verdicts.filter(v=>v.verdict==='SHIFT'&&v.shift_reason==='heater_swap'&&!v.dwelling_context).map(v=>v.anchor_id);if(missingDwelling.length){const msg2=missingDwelling.length+' heater_swap SHIFT verdict(s) missing dwelling_context: '+missingDwelling.join(', ')+'. Export anyway?';if(!confirm(msg2))return;}const blob=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verdicts_'+BATCH+'_'+ANNOTATOR+PAGE_SUFFIX+'.json';a.click();URL.revokeObjectURL(a.href);});
document.getElementById('import-input').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const m=JSON.parse(rd.result);(m.verdicts||[]).forEach(v=>{const r=ensureRec(v.anchor_id);r.verdict=v.verdict||'';r.corrected_interval_start=v.corrected_interval_start||'';r.corrected_interval_end=v.corrected_interval_end||'';r.shift_reason=v.shift_reason||'';r.dwelling_context=v.dwelling_context||'';r.notes=v.notes||'';r.opened_ts_utc=v.opened_ts_utc||'';r.submitted_ts_utc=v.submitted_ts_utc||'';r.adjudication_seconds=v.adjudication_seconds||0;});saveLS();document.querySelectorAll('.anchor').forEach(applyRec);}catch(e){alert('import failed: '+e);}};rd.readAsText(f);});
</script>
</body></html>
